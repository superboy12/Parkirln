name: smartpark_unila
description: "SmartPark Unila — Aplikasi Smart Parking Kampus berbasis Mobile Computing"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # UI & Fonts
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.0

  # Maps & GPS
  flutter_map: ^7.0.2
  latlong2: ^0.9.0
  geolocator: ^13.0.2

  # QR Code
  qr_flutter: ^4.1.0

  # Utility
  permission_handler: ^11.3.1
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  url_launcher: ^6.3.0

  # Camera & File
  camera: ^0.11.0
  path_provider: ^2.1.0
  path: ^1.8.3
  supabase_flutter: ^2.14.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
